<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RELT — Management Hub</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyCcrEbk9DBj2pBZK8Zd0pHjn03GzGQleyA",
  authDomain: "relt-hub.firebaseapp.com",
  databaseURL: "https://relt-hub-default-rtdb.europe-west1.firebasedatabase.app"
});
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #7B2020, #4A1212);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}
.gate {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 48px 40px;
  width: 420px;
  max-width: 95vw;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.gate h1 {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.gate .subtitle {
  font-size: 16px;
  opacity: 0.6;
  margin-bottom: 32px;
}
.gate input, .gate select {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 16px;
  font-family: inherit;
  outline: none;
  margin-bottom: 16px;
}
.gate input::placeholder { color: rgba(255,255,255,0.4); }
.gate input:focus, .gate select:focus {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
}
.gate select { cursor: pointer; }
.gate select option { background: #4A1212; color: white; }
.gate button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: white;
  color: #7B2020;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.gate button:hover { background: #f0e8e8; }
.gate button:active { transform: scale(0.98); }
.gate button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.error {
  color: #ff9999;
  font-size: 14px;
  margin-top: 12px;
  min-height: 20px;
}
.hidden { display: none; }
.loading {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid rgba(123,32,32,0.3);
  border-top-color: #7B2020;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.google-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: white;
  color: #333;
  font-weight: 600;
}
.google-btn:hover { background: #f5f5f5; }
.google-btn img { width: 20px; height: 20px; }
.auth-user {
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 20px;
}
.auth-user strong { opacity: 1; font-weight: 600; }
</style>
</head>
<body>

<div class="gate">
  <h1>RELT</h1>
  <div class="subtitle">Management Hub</div>

  <!-- Step 0: Google sign-in -->
  <div id="step0">
    <button class="google-btn" onclick="googleSignIn()" id="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
      Sign in with Google
    </button>
    <div class="error" id="google-error"></div>
  </div>

  <!-- Step 1: Password -->
  <div id="step1" class="hidden">
    <div class="auth-user" id="auth-user"></div>
    <input type="password" id="pw" placeholder="Enter password" autocomplete="off"
           onkeydown="if(event.key==='Enter')checkPassword()">
    <button onclick="checkPassword()" id="pw-btn">Open</button>
    <div class="error" id="pw-error"></div>
  </div>

  <!-- Step 2: Name selection -->
  <div id="step2" class="hidden">
    <select id="nameSelect">
      <option value="" disabled selected>Select your name...</option>
      <option value="Kjersti">Kjersti Høklingen</option>
      <option value="Laila">Laila Dahlen</option>
      <option value="Tiina">Tiina Aalto-Fischer</option>
      <option value="Mathilda">Mathilda Hayes</option>
      <option value="Miili">Miili Vaattovaara</option>
      <option value="Juha">Juha Karonen</option>
      <option value="Francesca">Francesca Cortesi</option>
      <option value="Anne">Anne Ormstad</option>
      <option value="Christine">Christine Gelfgren</option>
      <option value="Karl">Karl Stenstadvold</option>
      <option value="Ørjan">Ørjan Kronborg</option>
    </select>
    <button onclick="enterHub()" id="enter-btn" disabled>Continue</button>
  </div>
</div>

<script>
const DOC_ID = 'relt-hub-v2';
let decryptedHtml = null;
let googleCredential = null;

document.getElementById('nameSelect').addEventListener('change', function() {
  document.getElementById('enter-btn').disabled = !this.value;
});

async function googleSignIn() {
  const btn = document.getElementById('google-btn');
  const err = document.getElementById('google-error');
  btn.disabled = true;
  err.textContent = '';

  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ hd: 'm10s.io' });
    const result = await firebase.auth().signInWithPopup(provider);

    if (!result.user.email.endsWith('@m10s.io')) {
      await firebase.auth().signOut();
      err.textContent = 'Access restricted to @m10s.io accounts.';
      btn.disabled = false;
      return;
    }

    googleCredential = {
      idToken: result.credential.idToken,
      accessToken: result.credential.accessToken
    };

    document.getElementById('auth-user').innerHTML =
      'Signed in as <strong>' + result.user.email + '</strong>';
    document.getElementById('step0').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('pw').focus();
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user') {
      err.textContent = '';
    } else if (e.code === 'auth/unauthorized-domain') {
      err.textContent = 'This domain is not authorized. Contact the admin.';
    } else {
      err.textContent = 'Sign-in failed. Please try again.';
    }
    btn.disabled = false;
  }
}

async function checkPassword() {
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('pw-btn');
  const err = document.getElementById('pw-error');
  if (!pw) { err.textContent = 'Please enter a password.'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>Decrypting...';
  err.textContent = '';

  try {
    const r = await fetch('d.json?v=' + Date.now());
    if (!r.ok) throw new Error('Could not load content file.');
    const D = await r.json();

    const enc = new TextEncoder();
    const salt = Uint8Array.from(atob(D.s), c => c.charCodeAt(0));
    const iv   = Uint8Array.from(atob(D.i), c => c.charCodeAt(0));
    const ct   = Uint8Array.from(atob(D.c), c => c.charCodeAt(0));

    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      km,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    decryptedHtml = new TextDecoder().decode(dec);

    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  } catch (e) {
    err.textContent = 'Wrong password. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Open';
  }
}

function enterHub() {
  const sel = document.getElementById('nameSelect');
  const name = sel.value;
  const full = sel.selectedOptions[0].text;
  if (!name) return;

  firebase.database().ref(DOC_ID + '/logins').push({
    name: name,
    fullLabel: full,
    timestamp: Date.now(),
    time: new Date().toISOString()
  });

  document.title = 'RELT — Management Hub';
  const credJson = JSON.stringify(googleCredential).replace(/</g, '\\u003c');
  const injected = decryptedHtml.replace('<head>',
    '<head><script>window.RELT_USER="' + name + '";window.GOOGLE_CREDENTIAL=' + credJson + ';<\/script>');
  document.documentElement.innerHTML = '<head><style>*{margin:0;padding:0}html,body{height:100%;overflow:hidden}</style></head><body><iframe id="hub" style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;"></iframe></body>';
  const iframe = document.getElementById('hub');
  iframe.srcdoc = injected;
}
</script>

</body>
</html>
